name: WinStrata CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: workspace-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux workspace checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch the exact GitHub candidate
        shell: bash
        run: |
          git init --quiet
          git fetch --depth=2 --no-tags "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install the pinned toolchain
        shell: bash
        run: bash .github/scripts/install-ci-toolchain.sh
      - name: Verify the workspace
        shell: bash
        run: bash .github/scripts/check-workspace.sh

  windows:
    name: Windows workspace checks
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Fetch the exact GitHub candidate
        shell: bash
        run: |
          git init --quiet
          git fetch --depth=2 --no-tags "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Resolve the approved Node.js release
        shell: pwsh
        run: .\.github\scripts\install-windows-node.ps1
      - name: Resolve the repository Rust toolchain
        shell: pwsh
        run: cargo --version
      - name: Test the workspace on Windows
        shell: pwsh
        run: cargo test --locked --workspace

  workspace:
    name: Workspace checks
    needs: [linux, windows]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both platform jobs to succeed
        shell: bash
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          printf 'Linux %s, Windows %s\n' "$LINUX_RESULT" "$WINDOWS_RESULT"
          [[ "$LINUX_RESULT" == success && "$WINDOWS_RESULT" == success ]]
