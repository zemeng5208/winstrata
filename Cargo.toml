[workspace]
members = ["apps/desktop", "core", "kernel", "plugins/strata-env", "plugins/strata-health", "plugins/strata-process", "plugins/strata-registry", "protocols", "runtimes", "runtimes/shim", "services", "toolchains/dev"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=0.2.191"
windows-sys = "=0.61.2"
