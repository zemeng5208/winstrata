[package]
name = "winstrata-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
winstrata-kernel = { path = "../kernel" }
winstrata-protocols = { path = "../protocols" }
winstrata-strata-registry = { path = "../plugins/strata-registry" }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation",
    "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
    "Win32_System_Com", "Win32_System_Environment", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemServices",
    "Win32_System_Threading", "Win32_Security_Isolation", "Win32_UI_Shell",
] }
